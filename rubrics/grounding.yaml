# 根拠検証の rubric。共通の判断基準は src/uratori/llm/judge.py の RULES にある。
# state はブロック形式で書き、値は引用符で囲む（本文中のカンマで壊れないように）。
# examples の kind は positive（典型的に当てはまる例）、negative（典型的に当てはまらない例）、
# boundary（隣のラベルと迷いやすい例）。

- id: gr-support-noul
  domain: grounding
  type: noul
  question: "`主張` は `根拠` から支持されるか"
  criteria:
    "true": 根拠だけから主張の全体が成り立つ。
    "false": 根拠と食い違うか、根拠からは成り立つと言えない部分がある。
  notes: 主張が複数の部分からなるときは、全ての部分が支持されて初めて true。根拠が触れていない部分が 1 つでもあれば false。
  examples:
    - kind: positive
      state:
        根拠: "本製品の保証期間は購入日から2年間である。"
        主張: "購入から1年半の時点では保証が有効だ。"
      label: "true"
    - kind: negative
      state:
        根拠: "本製品の保証期間は購入日から2年間である。"
        主張: "購入から3年後でも保証が受けられる。"
      label: "false"
    - kind: boundary
      state:
        根拠: "本製品の保証期間は購入日から2年間である。"
        主張: "保証期間は2年間で、期間中の修理は無償だ。"
      label: "false"
      note: 前半は支持されるが、無償かどうかは根拠にない。

- id: gr-support-3
  domain: grounding
  type: choice
  question: "`主張` は `根拠` から支持されるか"
  criteria:
    支持: 根拠だけから主張の全体が成り立つ。
    矛盾: 根拠と両立しない部分がある。
    情報不足: 矛盾はないが、根拠からは成否を決められない部分がある。
  notes: 一部でも矛盾があれば矛盾。矛盾がなく、根拠が触れていない部分が残るなら情報不足。
  examples:
    - kind: positive
      state:
        根拠: "第3四半期の売上高は前年同期比12%増の48億円だった。"
        主張: "第3四半期は前年同期より売上が伸びた。"
      label: 支持
    - kind: negative
      state:
        根拠: "第3四半期の売上高は前年同期比12%増の48億円だった。"
        主張: "第3四半期の売上高は前年同期を下回った。"
      label: 矛盾
    - kind: boundary
      state:
        根拠: "第3四半期の売上高は前年同期比12%増の48億円だった。"
        主張: "第3四半期は売上、利益ともに前年同期を上回った。"
      label: 情報不足
      note: 利益には触れていない。食い違いはないので矛盾ではない。

- id: gr-contradict-noul
  domain: grounding
  type: noul
  question: "`主張` は `根拠` と矛盾するか"
  criteria:
    "true": 根拠と主張が両立しない。
    "false": 両立する。根拠が触れていない場合も含む。
  notes: 根拠にない内容を述べているだけでは矛盾にしない。
  examples:
    - kind: positive
      state:
        根拠: "申請の締め切りは3月15日（必着）である。"
        主張: "3月20日に届いた申請も受理される。"
      label: "true"
    - kind: negative
      state:
        根拠: "申請の締め切りは3月15日（必着）である。"
        主張: "3月10日に届くように申請を送れば間に合う。"
      label: "false"
    - kind: boundary
      state:
        根拠: "申請の締め切りは3月15日（必着）である。"
        主張: "申請はオンラインでも受け付けている。"
      label: "false"
      note: 根拠にない内容だが、食い違ってはいない。

- id: gr-number-match
  domain: grounding
  type: noul
  question: "`主張` に出てくる数値、日付、金額は `根拠` と一致するか"
  criteria:
    "true": 主張の数値は全て根拠と一致する。単位の換算や「約」の範囲の丸めは一致とみなす。
    "false": 一致しない数値がある。または根拠にない数値を述べている。
  examples:
    - kind: positive
      state:
        根拠: "会員数は2024年度末に1,250,000人に達した。"
        主張: "2024年度末の会員数は125万人だった。"
      label: "true"
    - kind: negative
      state:
        根拠: "会員数は2024年度末に1,250,000人に達した。"
        主張: "2024年度末の会員数は152万人だった。"
      label: "false"
    - kind: boundary
      state:
        根拠: "会員数は2024年度末に1,250,000人に達した。"
        主張: "2024年度末の会員数は130万人だった。"
      label: "false"
      note: 「約」がなく、丸めても125万人にしかならない。

- id: gr-condition-met
  domain: grounding
  type: choice
  question: "`事例` は `規定` の条件を満たすか"
  criteria:
    成立: 必要な条件が全て確認できる。
    不成立: 満たさない条件が確認できる。
    情報不足: 満たさない条件は見当たらないが、確認できない条件が残っている。
  notes: 書かれていない条件を「たぶん満たす」と埋めない。
  examples:
    - kind: positive
      state:
        規定: "未使用の商品に限り、購入から7日以内であれば返金できる。"
        事例: "購入3日後に、未開封のまま返金を申し出た。"
      label: 成立
    - kind: negative
      state:
        規定: "未使用の商品に限り、購入から7日以内であれば返金できる。"
        事例: "購入3日後に、数回使用した商品の返金を申し出た。"
      label: 不成立
    - kind: boundary
      state:
        規定: "未使用の商品に限り、購入から7日以内であれば返金できる。"
        事例: "購入5日後に返金の申し出があった。使用したかは不明。"
      label: 情報不足

- id: gr-attribution
  domain: grounding
  type: noul
  question: "`主張` が述べている発言者や行為の主体は、`根拠` と一致するか"
  criteria:
    "true": 誰が言ったか、誰が行ったかが根拠と一致する。
    "false": 主体が根拠と違う。または根拠からは主体を特定できない。
  examples:
    - kind: positive
      state:
        根拠: "田中部長は値上げに反対し、鈴木課長は条件つきで賛成した。"
        主張: "鈴木課長は条件つきで値上げに賛成した。"
      label: "true"
    - kind: negative
      state:
        根拠: "田中部長は値上げに反対し、鈴木課長は条件つきで賛成した。"
        主張: "田中部長は条件つきで値上げに賛成した。"
      label: "false"
    - kind: boundary
      state:
        根拠: "会議では値上げに反対する意見が出た。鈴木課長は条件つきで賛成した。"
        主張: "田中部長が値上げに反対した。"
      label: "false"
      note: 反対意見があったことは分かるが、誰の意見かは書かれていない。

- id: gr-decided-vs-considered
  domain: grounding
  type: choice
  question: "`事項` は `議事録` の中でどう扱われているか"
  criteria:
    決定: 決定した、合意したと書かれている。
    検討中: 話題にはなったが、結論は出ていない。
    言及なし: 議事録に出てこない。
  notes: 「〜する方向」「〜を検討する」「次回に持ち越す」は決定ではない。
  examples:
    - kind: positive
      state:
        議事録: "新オフィスへの移転は9月に行うことで合意した。"
        事項: "新オフィスへの移転時期"
      label: 決定
    - kind: negative
      state:
        議事録: "新オフィスへの移転は9月に行うことで合意した。"
        事項: "移転先の内装業者の選定"
      label: 言及なし
    - kind: boundary
      state:
        議事録: "新オフィスへの移転は9月を軸に調整する方向で、次回までに総務が日程案を出す。"
        事項: "新オフィスへの移転時期"
      label: 検討中
      note: 方向性は出ているが、合意したとは書かれていない。

- id: gr-citation-supports
  domain: grounding
  type: noul
  question: "`引用箇所` は `文` の内容を裏づけているか"
  criteria:
    "true": 引用箇所だけを読んで、文の内容が成り立つと言える。
    "false": 引用箇所は話題が同じだけで、文の内容までは裏づけていない。または食い違う。
  examples:
    - kind: positive
      state:
        文: "有給休暇は入社6か月後に10日付与される。"
        引用箇所: "入社日から6か月間継続勤務した従業員には、10日の年次有給休暇を付与する。"
      label: "true"
    - kind: negative
      state:
        文: "有給休暇は入社6か月後に10日付与される。"
        引用箇所: "年次有給休暇の取得を希望する従業員は、3日前までに上長へ申請する。"
      label: "false"
    - kind: boundary
      state:
        文: "有給休暇は入社6か月後に10日付与される。"
        引用箇所: "入社日から6か月間継続勤務した従業員には、年次有給休暇を付与する。"
      label: "false"
      note: 時期は合うが、日数が引用箇所にない。

- id: gr-support-degree
  domain: grounding
  type: score
  question: "`主張` はどの程度 `根拠` から支持されるか"
  criteria:
    - 主張の中心となる内容が支持されない。または根拠と食い違う。
    - 中心となる内容は支持されるが、支持されない部分が混じっている。
    - 主張の全体が支持される。
  examples:
    - kind: positive
      state:
        根拠: "新店舗は4月1日に横浜駅西口に開業し、初日の来客数は3,200人だった。"
        主張: "新店舗は4月1日に横浜で開業した。"
      label: "2"
    - kind: negative
      state:
        根拠: "新店舗は4月1日に横浜駅西口に開業し、初日の来客数は3,200人だった。"
        主張: "新店舗の開業は5月に延期された。"
      label: "0"
    - kind: boundary
      state:
        根拠: "新店舗は4月1日に横浜駅西口に開業し、初日の来客数は3,200人だった。"
        主張: "新店舗は4月1日に横浜で開業し、初日の売上は過去最高だった。"
      label: "1"

- id: gr-temporal-valid
  domain: grounding
  type: choice
  held_out: true
  question: "`基準日` の時点で、`主張` は `根拠` に照らして成り立つか"
  criteria:
    成り立つ: 基準日に有効な記述から主張が支持される。
    成り立たない: 基準日には失効、改定、未施行のいずれかで、主張は成り立たない。
    時点不明: 根拠の記述がいつの時点のものか分からず、決められない。
  examples:
    - kind: positive
      state:
        根拠: "2025年4月1日改定。配送料は全国一律550円とする。"
        基準日: "2025年6月10日"
        主張: "配送料は全国一律550円である。"
      label: 成り立つ
    - kind: negative
      state:
        根拠: "2025年4月1日改定。配送料は全国一律550円とする（改定前は770円）。"
        基準日: "2025年2月1日"
        主張: "配送料は全国一律550円である。"
      label: 成り立たない
      note: 基準日は改定より前で、その時点の配送料は770円。
    - kind: boundary
      state:
        根拠: "配送料は全国一律550円とする。"
        基準日: "2025年6月10日"
        主張: "配送料は全国一律550円である。"
      label: 時点不明
      note: いつの版か書かれていない。
