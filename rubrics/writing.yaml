# 文章と議事録の評価、業務分類。先行用途ではないので本数を絞っている。

- id: wr-summary-faithful
  domain: writing
  type: score
  question: "`要約` は `原文` に忠実か"
  criteria:
    - 原文と矛盾する内容が中心になっている。
    - 重要な点で原文と食い違う。
    - 大筋は合うが、原文にない内容が混じる。
    - 原文にない内容はないが、重要な点が抜けている。
    - 原文にない内容がなく、重要な点も抜けていない。
  notes: 文章のうまさは見ない。丁寧で長い要約を高く付けない。
  examples:
    - kind: positive
      state:
        原文: "4月10日の定例で、新料金プランの公開日を5月1日に決定した。担当は佐藤。"
        要約: "4月10日の定例で、新料金プランを5月1日に公開すると決めた。担当は佐藤。"
      label: "4"
    - kind: negative
      state:
        原文: "4月10日の定例で、新料金プランの公開日を5月1日に決定した。担当は佐藤。"
        要約: "新料金プランの公開は見送られた。"
      label: "0"
    - kind: boundary
      state:
        原文: "4月10日の定例で、新料金プランの公開日を5月1日に決定した。担当は佐藤。"
        要約: "新料金プランは5月1日に公開する。価格は現行より1割安くなる。"
      label: "2"
      note: 価格の話は原文にない。

- id: wr-requirement-met
  domain: writing
  type: noul
  question: "`文章` は `要件` を満たしているか"
  criteria:
    "true": 要件に書かれた条件を全て満たす。
    "false": 満たしていない条件がある。
  examples:
    - kind: positive
      state:
        要件: "納期と金額の両方を明記すること。"
        文章: "納期は6月30日、金額は税込55万円でお見積もりいたします。"
      label: "true"
    - kind: negative
      state:
        要件: "納期と金額の両方を明記すること。"
        文章: "詳細は追ってご連絡いたします。"
      label: "false"
    - kind: boundary
      state:
        要件: "納期と金額の両方を明記すること。"
        文章: "金額は税込55万円です。納期はご発注後にご相談させてください。"
      label: "false"
      note: 納期に触れてはいるが、明記していない。

- id: wr-action-item-owner
  domain: writing
  type: choice
  held_out: true
  question: "`発言` は担当者の決まったタスクを述べているか"
  criteria:
    担当者あり: やることと、誰がやるかの両方が分かる。
    担当者不明: やることは分かるが、誰がやるかが分からない。
    タスクではない: やることを述べていない。感想や報告など。
  examples:
    - kind: positive
      state:
        発言: "見積書は来週水曜までに高橋さんが先方に送ってください。"
      label: 担当者あり
    - kind: negative
      state:
        発言: "先週の展示会は来場者が多くて盛況でした。"
      label: タスクではない
    - kind: boundary
      state:
        発言: "見積書は来週水曜までに先方に送っておきましょう。"
      label: 担当者不明

- id: rt-inquiry-type
  domain: routing
  type: choice
  question: "`問い合わせ` の主な用件はどれか"
  criteria:
    返金: 支払った代金を返してほしい。
    交換: 商品を別のものに替えてほしい。
    配送: 配送の状況や日時について知りたい、変えたい。
    その他: 上のどれにも当たらない。
  notes: 用件が複数あるときは、相手に求めている行動を優先する。「〜なら返金してほしい」のような条件つきの要求も、求めている行動で決める。
  examples:
    - kind: positive
      state:
        問い合わせ: "届いた商品が壊れていました。代金を返していただけますか。"
      label: 返金
    - kind: negative
      state:
        問い合わせ: "領収書の宛名を会社名に変更できますか。"
      label: その他
    - kind: boundary
      state:
        問い合わせ: "注文した商品がまだ届きません。今週中に届かないなら返金してください。"
      label: 返金
      note: 条件つきでも、相手に求めている行動は返金。配送の遅れは理由として述べているだけ。
