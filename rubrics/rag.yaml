# RAG の流れの中の判断。検索結果を読んで、次に何をするかを決めるための質問。

- id: rag-relevance
  domain: rag
  type: score
  question: "`文書` は `質問` にどの程度関係するか"
  criteria:
    - 質問と関係がない。
    - 同じ話題を扱っているが、質問の答えは含まない。
    - 質問の答え、または答えの一部を含む。
  notes: 単語が重なるだけでは段階 1 にしない。同じ対象について述べているかで決める。
  examples:
    - kind: positive
      state:
        質問: "定期券の払い戻し手数料はいくらですか。"
        文書: "定期券の払い戻しには、1枚につき220円の手数料がかかる。"
      label: "2"
    - kind: negative
      state:
        質問: "定期券の払い戻し手数料はいくらですか。"
        文書: "当駅の営業時間は始発から終電までである。"
      label: "0"
    - kind: boundary
      state:
        質問: "定期券の払い戻し手数料はいくらですか。"
        文書: "定期券の払い戻しは、駅の窓口で本人確認書類を提示して行う。"
      label: "1"
      note: 払い戻しの話だが、手数料は書かれていない。

- id: rag-answerable
  domain: rag
  type: choice
  question: "`検索結果` だけを使って `質問` に答えられるか"
  criteria:
    回答可能: 質問の全ての部分に答えられる。
    一部のみ: 答えられる部分と答えられない部分がある。
    回答不可: 答えに必要な情報がない。
  examples:
    - kind: positive
      state:
        質問: "住民票の写しは何時まで窓口で受け取れますか。"
        検索結果: "住民票の写しの交付は、平日の8時30分から17時15分まで市民課の窓口で受け付ける。"
      label: 回答可能
    - kind: negative
      state:
        質問: "住民票の写しは何時まで窓口で受け取れますか。"
        検索結果: "住民票の写しの交付手数料は1通300円である。"
      label: 回答不可
    - kind: positive
      state:
        質問: "住民票の写しは何時まで窓口で受け取れますか。土曜日も受け取れますか。"
        検索結果: "住民票の写しの交付は、平日の8時30分から17時15分まで市民課の窓口で受け付ける。"
      label: 回答可能
      note: 「平日」と限定しているので、土曜日は受け付けないと答えられる。
    - kind: boundary
      state:
        質問: "住民票の写しは何時まで窓口で受け取れますか。手数料はいくらですか。"
        検索結果: "住民票の写しの交付は、平日の8時30分から17時15分まで市民課の窓口で受け付ける。"
      label: 一部のみ
      note: 時刻には答えられるが、手数料は書かれていない。

- id: rag-sufficiency
  domain: rag
  type: score
  question: "`検索結果` は `質問` に答えるのに十分か"
  criteria:
    - 質問に答える情報がない。
    - 一部には答えられるが、答えられない部分が残る。
    - 質問の全てに答えられる。
  examples:
    - kind: positive
      state:
        質問: "育児休業は子どもが何歳になるまで取れますか。"
        検索結果: "育児休業は、原則として子が1歳に達するまで取得できる。"
      label: "2"
    - kind: negative
      state:
        質問: "育児休業は子どもが何歳になるまで取れますか。"
        検索結果: "介護休業は、対象家族1人につき通算93日まで取得できる。"
      label: "0"
    - kind: boundary
      state:
        質問: "育児休業は子どもが何歳になるまで取れますか。延長はできますか。"
        検索結果: "育児休業は、原則として子が1歳に達するまで取得できる。"
      label: "1"

- id: rag-need-more-search
  domain: rag
  type: noul
  question: "`質問` に答えるために、`検索結果` に加えて追加の検索が必要か"
  criteria:
    "true": 答えに必要な情報が検索結果に欠けている。
    "false": 検索結果だけで答えられる。
  examples:
    - kind: positive
      state:
        質問: "A社とB社の2024年度の営業利益はどちらが大きいですか。"
        検索結果: "A社の2024年度の営業利益は120億円だった。"
      label: "true"
    - kind: negative
      state:
        質問: "A社とB社の2024年度の営業利益はどちらが大きいですか。"
        検索結果: "2024年度の営業利益は、A社が120億円、B社が95億円だった。"
      label: "false"
    - kind: boundary
      state:
        質問: "A社とB社の2024年度の営業利益はどちらが大きいですか。"
        検索結果: "A社の2024年度の営業利益は120億円だった。B社の2023年度の営業利益は95億円だった。"
      label: "true"
      note: B社は年度が違う。

- id: rag-answer-faithful
  domain: rag
  type: choice
  question: "`回答` は `検索結果` に忠実か"
  criteria:
    忠実: 回答の内容は全て検索結果から言える。
    根拠なしを含む: 検索結果と食い違いはないが、検索結果にない内容が含まれる。
    矛盾を含む: 検索結果と食い違う内容が含まれる。
  notes: 矛盾と根拠なしの両方があれば、矛盾を含む。
  examples:
    - kind: positive
      state:
        検索結果: "図書館の貸出期間は2週間で、予約が入っていなければ1回だけ延長できる。"
        回答: "貸出期間は2週間です。予約がなければ1回延長できます。"
      label: 忠実
    - kind: negative
      state:
        検索結果: "図書館の貸出期間は2週間で、予約が入っていなければ1回だけ延長できる。"
        回答: "貸出期間は2週間で、何回でも延長できます。"
      label: 矛盾を含む
    - kind: boundary
      state:
        検索結果: "図書館の貸出期間は2週間で、予約が入っていなければ1回だけ延長できる。"
        回答: "貸出期間は2週間です。延長はウェブサイトから手続きできます。"
      label: 根拠なしを含む
      note: 手続きの方法は検索結果にない。

- id: rag-answer-complete
  domain: rag
  type: score
  question: "`回答` は `質問` で聞かれたことに全て答えているか"
  criteria:
    - 聞かれたことに答えていない。
    - 一部には答えているが、答えていない部分がある。
    - 聞かれたこと全てに答えている。
  notes: 回答の正しさは問わない。聞かれた項目に対応する記述があるかだけを見る。
  examples:
    - kind: positive
      state:
        質問: "申請に必要な書類と、提出先を教えてください。"
        回答: "必要な書類は申請書と本人確認書類です。提出先は市役所2階の福祉課です。"
      label: "2"
    - kind: negative
      state:
        質問: "申請に必要な書類と、提出先を教えてください。"
        回答: "申請は年度内であればいつでも可能です。"
      label: "0"
    - kind: boundary
      state:
        質問: "申請に必要な書類と、提出先を教えてください。"
        回答: "必要な書類は申請書と本人確認書類です。"
      label: "1"

- id: rag-conflict-among-docs
  domain: rag
  type: noul
  held_out: true
  question: "`質問` の答えについて、`文書1` と `文書2` は食い違っているか"
  criteria:
    "true": 質問の答えに関わる部分で、両立しない記述がある。
    "false": 食い違いはない。質問と関係のない部分の違いは数えない。
  examples:
    - kind: positive
      state:
        質問: "受付は何時までですか。"
        文書1: "受付時間は9時から17時まで。"
        文書2: "受付は18時で終了する。"
      label: "true"
    - kind: negative
      state:
        質問: "受付は何時までですか。"
        文書1: "受付時間は9時から17時まで。"
        文書2: "受付は17時に終了する。場所は1階ロビー。"
      label: "false"
    - kind: boundary
      state:
        質問: "受付は何時までですか。"
        文書1: "受付時間は9時から17時まで。場所は1階ロビー。"
        文書2: "受付は17時に終了する。場所は2階の会議室。"
      label: "false"
      note: 場所は食い違うが、質問は時刻だけを聞いている。
