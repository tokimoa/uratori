# LLM の接続先。全て OpenAI 互換の chat completions。API キーはここには書かず、api_key_env の環境変数から読む。
# price_in と price_out は 1M トークンあたりのドルで、費用の記録と上限（--budget-usd）に使う。
# モデル名と価格は変わるので、使う前に提供元で確かめて書き換える。
# 出力を学習データや公開データに使えるかは提供元の利用規約による。使う前に確かめる。

deepseek-flash:
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-flash
  price_in: 0.30
  price_out: 1.20
  max_tokens: 16384  # 推論のトークンも出力上限に数えられるので広く取る

# 同じモデルで推論を軽くしたもの。生成の費用を抑えるために使う
deepseek-flash-low:
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-flash
  price_in: 0.30
  price_out: 1.20
  max_tokens: 16384
  extra_body:
    reasoning_effort: low

# ローカルの MLX。`mlx_lm.server --model <id> --port 8089` で立てる
local-mlx:
  base_url: http://localhost:8089/v1
  api_key_env: null
  model: mlx-community/gemma-4-26b-a4b-it-4bit
  price_in: 0.0
  price_out: 0.0
  max_tokens: 4096   # 思考つき。小さくすると思考だけで使い切り、応答が空になる
  json_mode: false

# 同じモデルで思考を切ったもの
local-mlx-nothink:
  base_url: http://localhost:8089/v1
  api_key_env: null
  model: mlx-community/gemma-4-26b-a4b-it-4bit
  price_in: 0.0
  price_out: 0.0
  max_tokens: 512
  json_mode: false
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

# ローカルのモデルを生成に使うとき。応答が長いので上限を広く取る
local-mlx-gen:
  base_url: http://localhost:8089/v1
  api_key_env: null
  model: mlx-community/gemma-4-26b-a4b-it-4bit
  price_in: 0.0
  price_out: 0.0
  max_tokens: 6000
  json_mode: false
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
